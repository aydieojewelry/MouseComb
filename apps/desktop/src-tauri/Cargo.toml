[package]
name = "mousecomb-desktop"
version = "0.0.0"
description = "MouseComb for Windows"
edition.workspace = true
license.workspace = true
publish.workspace = true
default-run = "mousecomb-desktop"

[lib]
name = "mousecomb_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "export-bindings"
path = "src/bin/export_bindings.rs"

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
mc-core = { workspace = true, features = ["specta"] }
mc-store.workspace = true
mc-sync = { workspace = true, features = ["specta"] }
mc-win = { workspace = true, features = ["specta"] }

tauri = { version = "2.12.4", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-opener = "2.7.2"
tauri-plugin-log = "2.10.1"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-updater = "2.14.0"
tauri-plugin-notification = "2.7.0"
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-dialog = "2"
getrandom = "0.3"

tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta.workspace = true
specta-typescript.workspace = true

serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
log.workspace = true
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }

[target.'cfg(windows)'.dependencies]
keyring-core = "1.0.1"
windows-native-keyring-store = "1.1.0"
