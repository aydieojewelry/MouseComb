# Runs on every pull request and on main. A PR can merge only when all jobs pass
# (branch protection, CR/PIPELINE.md §3).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  GOTOOLCHAIN: auto

jobs:
  rust:
    name: Rust (lint + tests with live backend)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/pocketbase/go.mod
          cache-dependency-path: services/pocketbase/go.sum
      - name: Start backend
        working-directory: services/pocketbase
        run: |
          go build -o /tmp/mousecomb-server .
          /tmp/mousecomb-server serve --dir /tmp/pb_data --http 127.0.0.1:8090 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8090/api/health && break; sleep 1; done
      - name: Frontend dist placeholder for tauri::generate_context!
        run: mkdir -p apps/desktop/dist
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
        env:
          MC_TEST_PB_URL: http://127.0.0.1:8090
      - name: TypeScript bindings match the Rust commands
        run: |
          cargo run -q -p mousecomb-desktop --bin export-bindings
          git diff --exit-code packages/bindings

  backend:
    name: Backend (Go)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/pocketbase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/pocketbase/go.mod
          cache-dependency-path: services/pocketbase/go.sum
      - run: go vet ./...
      - run: CGO_ENABLED=0 go build -o mousecomb-server .

  frontend:
    name: Frontend (types, tests, build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: node --test "scripts/*.test.mjs"
      - run: pnpm --filter @mousecomb/desktop build

  installers:
    name: Installers (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2022
            files: |
              target/release/bundle/nsis/*.exe
              target/release/bundle/msi/*.msi
          # The oldest supported Ubuntu, so the AppImage runs on older distros too.
          - name: Linux
            os: ubuntu-22.04
            files: |
              target/release/bundle/deb/*.deb
              target/release/bundle/rpm/*.rpm
              target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev rpm
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      # Unsigned test installers from this commit; releases are built by release.yml.
      - run: pnpm --filter @mousecomb/desktop tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: MouseComb-${{ matrix.name }}-${{ github.sha }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14
