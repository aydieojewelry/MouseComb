# Weekly release train (VERSIONING.md, PIPELINE.md §4).
# Off until the repository variable RELEASES_ENABLED is "true" (end of M1).
# Publishing waits for a human approval on the "release" environment.
name: Release

on:
  schedule:
    - cron: "17 6 * * 2" # Tuesdays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Work out the next version
    if: vars.RELEASES_ENABLED == 'true'
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.next.outputs.release }}
      tag: ${{ steps.next.outputs.tag }}
      display: ${{ steps.next.outputs.display }}
      notes: ${{ steps.next.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: next
        run: |
          node scripts/version.mjs next --build "$GITHUB_RUN_NUMBER" > next.json
          cat next.json
          {
            echo "release=$(node -p 'require("./next.json").release')"
            echo "tag=$(node -p 'require("./next.json").tag ?? ""')"
            echo "display=$(node -p 'require("./next.json").display ?? ""')"
            echo "notes<<EOF_NOTES"
            node -p 'require("./next.json").notes ?? ""'
            echo "EOF_NOTES"
          } >> "$GITHUB_OUTPUT"

  # One draft release that both platform builds upload to; published once both are in.
  draft:
    name: Create the draft release
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-24.04
    environment: release
    outputs:
      id: ${{ steps.create.outputs.id }}
    steps:
      - id: create
        uses: actions/github-script@v7
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          NAME: MouseComb ${{ needs.plan.outputs.display }}
          NOTES: ${{ needs.plan.outputs.notes }}
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: process.env.TAG,
              target_commitish: context.sha,
              name: process.env.NAME,
              body: process.env.NOTES,
              draft: true,
            });
            core.setOutput("id", data.id);

  publish:
    name: Build and sign (${{ matrix.name }})
    needs: [plan, draft]
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Windows
            os: windows-2022
          # The oldest supported Ubuntu, so the AppImage runs on older distros too.
          - name: Linux
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: System libraries for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev rpm
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - name: Stamp version
        shell: bash
        run: node scripts/version.mjs apply "${{ needs.plan.outputs.display }}"
      # Installed apps verify every update against this public key (FEAT-022).
      - name: Turn on signed updates
        shell: bash
        env:
          PUBKEY: ${{ vars.MOUSECOMB_UPDATER_PUBKEY }}
        run: |
          node -e '
            const fs = require("fs");
            const file = "apps/desktop/src-tauri/tauri.conf.json";
            if (!process.env.PUBKEY) {
              console.error("Set the MOUSECOMB_UPDATER_PUBKEY repository variable (PIPELINE.md, one-time setup).");
              process.exit(1);
            }
            const conf = JSON.parse(fs.readFileSync(file, "utf8"));
            conf.bundle.createUpdaterArtifacts = true;
            conf.plugins.updater.pubkey = process.env.PUBKEY;
            fs.writeFileSync(file, JSON.stringify(conf, null, 2) + "\n");
          '
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          MOUSECOMB_DEFAULT_SERVER: ${{ vars.MOUSECOMB_DEFAULT_SERVER }}
          MOUSECOMB_BUILD: ${{ github.run_number }}
        with:
          projectPath: apps/desktop
          releaseId: ${{ needs.draft.outputs.id }}
          # latest.json lists both platforms; Windows updates use the per-user
          # NSIS installer, Linux updates the AppImage.
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

  release:
    name: Publish the release
    needs: [draft, publish]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/github-script@v7
        env:
          ID: ${{ needs.draft.outputs.id }}
        with:
          script: |
            await github.rest.repos.updateRelease({ ...context.repo, release_id: Number(process.env.ID), draft: false });
