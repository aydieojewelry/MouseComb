# Weekly release train (VERSIONING.md, PIPELINE.md §4).
# Off until the repository variable RELEASES_ENABLED is "true" (end of M1).
# Publishing waits for a human approval on the "release" environment.
name: Release

on:
  schedule:
    - cron: "17 6 * * 2" # Tuesdays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Work out the next version
    if: vars.RELEASES_ENABLED == 'true'
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.next.outputs.release }}
      tag: ${{ steps.next.outputs.tag }}
      display: ${{ steps.next.outputs.display }}
      notes: ${{ steps.next.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: next
        run: |
          node scripts/version.mjs next --build "$GITHUB_RUN_NUMBER" > next.json
          cat next.json
          {
            echo "release=$(node -p 'require("./next.json").release')"
            echo "tag=$(node -p 'require("./next.json").tag ?? ""')"
            echo "display=$(node -p 'require("./next.json").display ?? ""')"
            echo "notes<<EOF_NOTES"
            node -p 'require("./next.json").notes ?? ""'
            echo "EOF_NOTES"
          } >> "$GITHUB_OUTPUT"

  publish:
    name: Build, sign and publish
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: windows-2022
    # Required reviewers on this environment are the human approval gate.
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - name: Stamp version
        shell: bash
        run: node scripts/version.mjs apply "${{ needs.plan.outputs.display }}"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          MOUSECOMB_DEFAULT_SERVER: ${{ vars.MOUSECOMB_DEFAULT_SERVER }}
          MOUSECOMB_BUILD: ${{ github.run_number }}
        with:
          projectPath: apps/desktop
          tagName: ${{ needs.plan.outputs.tag }}
          releaseName: MouseComb ${{ needs.plan.outputs.display }}
          releaseBody: ${{ needs.plan.outputs.notes }}
          releaseDraft: false
          prerelease: false
